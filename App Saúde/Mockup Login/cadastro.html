<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | BioForm Health OS</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- Painel da marca (some no celular) -->
    <section class="hero">
      <div class="brand">
        <img src="logo.svg" alt="Logo BioForm">
        <div class="brand-name">Bio<span>Form</span><small>Health OS</small></div>
      </div>
      <h2 class="hero-title">Comece hoje. <b>Evolua todo dia.</b></h2>
      <ul class="hero-list">
        <li><span class="dot dot-flame"></span>Monte suas fichas de treino em minutos</li>
        <li><span class="dot dot-green"></span>Acompanhe dieta, água e bem-estar</li>
        <li><span class="dot dot-violet"></span>Conquiste selos e suba no ranking</li>
      </ul>
    </section>

    <!-- Formulário -->
    <section class="content">
      <div class="card">

        <div class="brand brand-mobile">
          <img src="logo.svg" alt="Logo BioForm">
          <div class="brand-name">Bio<span>Form</span><small>Health OS</small></div>
        </div>

        <h1>Crie sua conta</h1>
        <p class="subtitle">Seu treino, sua dieta, seu ciclo, <b>seu ritmo</b>.</p>

        <!-- Ao enviar, vai para o login mostrando o aviso de sucesso -->
        <form action="login.html#conta-criada">
          <div class="field">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome e sobrenome" autocomplete="name" minlength="3" required>
          </div>

          <div class="row">
            <div class="field">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric"
                     pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" maxlength="14"
                     title="Digite os 11 números do CPF" required>
            </div>

            <div class="field">
              <label for="celular">Celular</label>
              <input type="tel" id="celular" placeholder="(21) 99999-9999" autocomplete="tel"
                     pattern="\(?\d{2}\)?\s?9?\d{4}-?\d{4}" maxlength="15"
                     title="Digite o DDD e o número" required>
            </div>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="voce@email.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="8" required>
            <span class="hint">Mínimo de 8 caracteres.</span>
          </div>

          <div class="field">
            <label for="confirmar">Confirmar senha</label>
            <input type="password" id="confirmar" placeholder="Repita a senha" autocomplete="new-password" minlength="8" required>
          </div>

          <label class="check">
            <input type="checkbox" required>
            <span>Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a></span>
          </label>

          <button type="submit" class="btn btn-primary">Criar conta</button>
        </form>

        <p class="footer-text">Já tem uma conta? <a href="login.html">Entrar</a></p>
      </div>
    </section>

  </main>
</body>
</html>
