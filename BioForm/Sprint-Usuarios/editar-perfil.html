<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar perfil | BioForm</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><h1>Editar perfil</h1><p>Prévia da interface de edição de usuário.</p><form id="perfil"><label for="nome">Nome</label><input id="nome" autocomplete="name" required value="Usuário de exemplo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required value="exemplo@bioform.test"><div class="actions"><button type="submit">Salvar alterações</button><button type="reset" class="secondary">Cancelar</button></div><p id="mensagem" role="status" aria-live="polite"></p></form><small>Os dados são fictícios. Nenhuma alteração é salva no banco de dados.</small></main><script>const f=document.getElementById('perfil'),m=document.getElementById('mensagem');f.addEventListener('submit',e=>{e.preventDefault();m.textContent=f.reportValidity()?'Formulário válido. Integração com banco de dados pendente.':'';m.className='success'});f.addEventListener('reset',()=>m.textContent='');</script></body></html>
